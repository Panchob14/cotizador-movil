<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Cotizador</title>
<style>
:root{
  --ink:#18212f;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;
  --card:#fff;--accent:#18212f;--accent2:#374151;--success:#12805c;--gold:#f2c400;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef1f5 0%,#f8f8f8 42%,#f3f4f6 100%);color:var(--ink)}
.wrap{max-width:680px;margin:auto;padding:14px 14px 28px}
.header{
  background:linear-gradient(135deg,#050505,#1b1b1b);color:#fff;border-radius:22px;
  padding:18px 18px 20px;margin-bottom:14px;box-shadow:0 10px 28px rgba(17,24,39,.18);
  border:1px solid #d6ad00
}
.logo{display:block;width:100%;max-width:430px;height:auto;margin:0 auto 12px;border-radius:12px}

.brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.72;font-weight:700}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
.sub{color:#d1d5db;font-size:14px}
.card{background:var(--card);border:1px solid rgba(229,231,235,.9);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px rgba(17,24,39,.06)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title h2{font-size:18px;margin:0}
.badge{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:#fff7cc;color:#735d00}
label{display:block;font-size:12px;font-weight:800;color:#374151;margin:12px 0 6px}
input,select,button,textarea{width:100%;font:inherit;border-radius:12px}
input,select{padding:13px;border:1px solid #d7dbe1;background:#fff;color:#111827;outline:none}
input:focus,select:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(55,65,81,.1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;padding:14px;font-weight:800;cursor:pointer;transition:.15s transform}
.btn:active{transform:scale(.98)}
.primary{background:#111;color:#fff;border:1px solid #d6ad00}
.secondary{background:#eef0f3;color:#1f2937}
.item{border:1px solid #e1e4e8;border-radius:15px;padding:14px;margin-top:12px;position:relative;background:#fcfcfd}
.item h3{margin:0 0 2px;font-size:15px}.muted{font-size:12px;color:var(--muted)}
.remove{position:absolute;right:10px;top:10px;width:auto;padding:7px 10px;border:0;border-radius:9px;background:#fef0f0;color:#a33a3a;font-size:12px;font-weight:700}
.add{border:1px dashed #c6a900;background:#fffdf2;color:#5b4b00}
.totalbox{background:linear-gradient(135deg,#090909,#242424);color:#fff;border-radius:18px;padding:18px;border:1px solid #d6ad00}
.total-label{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.total{font-size:34px;font-weight:900;margin:4px 0}
.note{font-size:12px;color:#6b7280}.totalbox .note{color:#cbd5e1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.whatsapp{background:#12805c;color:#fff}
.msg{white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;padding:14px;border-radius:12px;font-size:14px;line-height:1.5}
#copiado{color:var(--success);font-weight:700}
.footer{text-align:center;color:#9ca3af;font-size:11px;padding:4px 0 0}
@media(max-width:430px){
 .wrap{padding:10px 10px 22px}.header{padding:20px 17px}
 .row{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}
 h1{font-size:25px}.total{font-size:32px}
}
</style>
</head>

    <div class="brand">Cotizador móvil</div>
    <h1>🧾 Cotización rápida</h1>
    <div class="sub">Calcula y envía tu cotización desde el teléfono</div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Datos del cliente</h2><span class="badge">Paso 1</span></div>
    <label>Cliente</label><input id="cliente" placeholder="Nombre del cliente">
    <label>Dirección / comuna</label><input id="direccion" placeholder="Dirección o comuna">
  </div>

  <div class="card">
    <div class="section-title"><h2>Productos</h2><span class="badge">Paso 2</span></div>
    <div id="items"></div>
    <button class="btn add" style="margin-top:12px" onclick="agregarItem()">＋ Agregar otra cortina</button>
  </div>

  <div class="card totalbox">
    <div class="total-label">Total de la cotización</div>
    <div class="total" id="total">$0</div>
    <div class="note" id="rango"></div>
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" onclick="generarMensaje()">Generar cotización</button>
      <button class="btn secondary" onclick="limpiar()">Nueva cotización</button>
    </div>
  </div>

  <div class="card" id="mensajeCard" style="display:none">
    <div class="section-title"><h2>📲 Mensaje listo</h2><span class="badge">Paso 3</span></div>
    <div class="msg" id="mensaje"></div>
    <div class="actions" style="margin-top:10px">
      <button class="btn primary" onclick="copiarMensaje()">Copiar mensaje</button>
      <button class="btn whatsapp" onclick="abrirWhatsApp()">WhatsApp</button>
    </div>
    <div id="copiado" class="note" style="margin-top:8px"></div>
  </div>
<div class="footer">Cotizador móvil · Uso interno</div>
</div>

<script>
const DATA={
 Blackout:{alto:200,precios:[[60,9850],[90,14250],[120,19200],[150,24000],[180,28500],[200,32250]]},
 Screen:{alto:240,precios:[[80,13950],[100,17000],[120,20400],[140,23700],[150,24800],[160,26400],[180,29300],[200,29700]]},
 Duo:{alto:240,precios:[[80,14900],[100,18600],[120,22350],[150,27900],[180,33500],[200,37200],[220,40900]]}
};
const AJUSTE=5000, VEN=18000, FACTOR=1.30;
let items=[];

function money(n){return "$"+Math.round(n).toLocaleString("es-CL")}
function agregarItem(model="Blackout"){
 items.push({id:Date.now()+Math.random(),model,ancho:"",cantidad:1});
 render();
}
function quitar(id){items=items.filter(x=>x.id!==id);render();}
function render(){
 const box=document.getElementById("items"); box.innerHTML="";
 items.forEach((it,i)=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML=`<button class="remove" onclick="quitar(${it.id})">Eliminar</button>
  <h3>Cortina ${i+1}</h3>
  <label>Modelo</label>
  <select onchange="cambiar(${it.id},'model',this.value)">
    ${Object.keys(DATA).map(m=>`<option ${m===it.model?'selected':''}>${m}</option>`).join("")}
  </select>
  <div class="row">
   <div><label>Ancho (cm)</label><input type="number" min="1" inputmode="numeric" value="${it.ancho}" placeholder="Ej. 135" onchange="cambiar(${it.id},'ancho',this.value)"></div>
   <div><label>Alto (cm)</label><input value="${DATA[it.model].alto}" disabled></div>
  </div>
  <div class="row">
   <div><label>Cantidad</label><input type="number" min="1" inputmode="numeric" value="${it.cantidad}" onchange="cambiar(${it.id},'cantidad',this.value)"></div>
   <div style="display:flex;align-items:end"><div class="note" id="res-${it.id}"></div></div>
  </div>`;
  box.appendChild(d); actualizarItem(it);
 });
 actualizarTotal();
}
function cambiar(id,k,v){const it=items.find(x=>x.id===id);if(!it)return;it[k]=k==="cantidad"?Math.max(1,parseInt(v||1)):v;render();}
function calcular(it){
 const ancho=Number(it.ancho), arr=DATA[it.model].precios;
 if(!ancho)return {ok:false};
 let applied=arr.find(x=>x[0]>=ancho);
 if(!applied)return {ok:false,out:true};
 const ajuste=applied[0]===ancho?0:AJUSTE;
 const cantidad=Number(it.cantidad||1);
 const costoProducto=(applied[1]+ajuste)*cantidad;
 const subtotalConMargen=costoProducto*FACTOR;
 return {ok:true,out:false,applied:applied[0],base:applied[1],ajuste,unit:(applied[1]+ajuste)*FACTOR,total:subtotalConMargen};
}
function actualizarItem(it){
 const r=calcular(it), el=document.getElementById("res-"+it.id);
 if(!el)return;
 if(r.out)el.textContent="MEDIDA FUERA DE RANGO";
 else if(r.ok)el.textContent=`Medida aplicada: ${r.applied} cm · Total: ${money(r.total)}`;
 else el.textContent="";
}
function actualizarTotal(){
 let total=0,out=false,hayValido=false;
 items.forEach(it=>{const r=calcular(it);if(r.out)out=true;else if(r.ok){total+=r.total;hayValido=true;}});
 if(hayValido) total+=VEN;
 document.getElementById("total").textContent=money(total);
 document.getElementById("rango").textContent=out?"Hay una medida fuera de rango. Revísala antes de enviar.":"";
}
function generarMensaje(){
 let cliente=document.getElementById("cliente").value.trim(),dir=document.getElementById("direccion").value.trim();
 let lines=["Hola"+(cliente?" "+cliente:"")+", te envío la cotización solicitada:",""];
 let total=0, valido=true;
 items.forEach((it,i)=>{
  const r=calcular(it); if(!r.ok||r.out){valido=false;return;}
  lines.push(`• ${it.model} — ${it.ancho} x ${DATA[it.model].alto} cm — Cantidad: ${it.cantidad}`);
  lines.push(`  Valor: ${money(r.total)}`);
  total+=r.total;
 });
 if(!items.length)valido=false;
 if(!valido){alert("Completa las medidas y revisa que ninguna supere el máximo.");return;}
 lines.push("",`TOTAL: ${money(total)}`);
 if(dir)lines.push(``, `Dirección/comuna: ${dir}`);
 lines.push("","Quedo atento/a a cualquier consulta.");
 document.getElementById("mensaje").textContent=lines.join("\n");
 document.getElementById("mensajeCard").style.display="block";
 document.getElementById("copiado").textContent="";
 document.getElementById("mensajeCard").scrollIntoView({behavior:"smooth"});
}
async function copiarMensaje(){
 const t=document.getElementById("mensaje").textContent;
 try{await navigator.clipboard.writeText(t);document.getElementById("copiado").textContent="✓ Mensaje copiado. Ya puedes pegarlo en WhatsApp."}
 catch(e){alert("No se pudo copiar automáticamente. Mantén presionado el texto para copiarlo.");}
}
function abrirWhatsApp(){
 const t=document.getElementById("mensaje").textContent;
 if(!t)return;
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
function limpiar(){
 items=[];document.getElementById("cliente").value="";document.getElementById("direccion").value="";
 document.getElementById("mensajeCard").style.display="none";agregarItem();
}
agregarItem();
</script>
</body>
</html>
